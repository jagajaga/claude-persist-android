name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The repository was recreated (public, history rewritten), so its run
      # numbers began again at 1. Installed phones have up to 0.1.53 (code 53):
      # every build counts on from 100 so it still installs over them.
      - name: Version
        run: |
          n=$(( ${{ github.run_number }} + 100 ))
          echo "VERSION_CODE=$n" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.1.$n" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner ships an Android SDK; it only needs its licences accepted,
      # after which the Android Gradle plugin fetches whatever platform it lacks.
      # (android-actions/setup-android failed here on an interactive licence prompt.)
      - name: Accept Android SDK licences
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Firebase, for notifications through Google; kept out of the repository.
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: gradle --no-daemon assembleRelease

      - name: Verify the APK is signed
        if: github.event_name != 'pull_request'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -3
          cp "$APK" "claude-persist-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: claude-persist-apk
          path: claude-persist-*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" claude-persist-*.apk \
            --title "$VERSION_NAME" \
            --notes "Built from ${GITHUB_SHA::7}. Install over the previous version; same signing key." \
            --latest
